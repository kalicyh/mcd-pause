<div id="mcpause-app">
  <style>
    #mcpause-app{--p-bg:light-dark(#fffdf8,#24221e);--p-fg:light-dark(#27221c,#f6eee0);--p-muted:light-dark(#686052,#c0b6a4);--p-line:light-dark(#e5ded0,#494235);--p-soft:light-dark(#f4efe5,#302c25);--p-gold:light-dark(#ffd25a,#e8b542);--p-ink:light-dark(#362609,#2d2008);--p-ok:light-dark(#246347,#97d7b1);--p-warn:light-dark(#99391d,#ffb292);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--p-fg);max-width:760px;margin:auto}
    #mcpause-app *{box-sizing:border-box}#mcpause-app [hidden]{display:none!important}
    #mcpause-app .p-shell{background:var(--p-bg);border:1px solid var(--p-line);border-radius:20px;overflow:hidden}
    #mcpause-app .p-head{display:flex;align-items:center;gap:12px;padding:24px 24px 14px}#mcpause-app .p-logo{background:var(--p-gold);color:var(--p-ink);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;font-size:25px;font-weight:600;flex:none}
    #mcpause-app h2{font-size:19px;line-height:1.4;margin:0;font-weight:600}#mcpause-app h3{font-size:21px;line-height:1.45;font-weight:600;margin:8px 0 14px}#mcpause-app h4{font-size:15px;margin:0 0 8px;font-weight:600}#mcpause-app p{margin:8px 0 14px}
    #mcpause-app .p-small{font-size:12px;color:var(--p-muted)}#mcpause-app .p-muted{color:var(--p-muted)}#mcpause-app .p-mode{padding:0 24px 14px;color:var(--p-muted);font-size:12px}
    #mcpause-app .p-nav{display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid var(--p-line);padding:0 18px 14px}#mcpause-app button{font:inherit;color:var(--p-fg);background:var(--p-soft);border:1px solid transparent;border-radius:9px;padding:9px 13px;min-height:40px}#mcpause-app button:hover{border-color:var(--p-line)}#mcpause-app button:disabled{opacity:.55}
    #mcpause-app .p-nav button{background:transparent;font-size:13px}#mcpause-app .p-nav button[aria-pressed="true"],#mcpause-app .p-primary{background:var(--p-gold);color:var(--p-ink)}
    #mcpause-app .p-main{padding:22px 24px}#mcpause-app .p-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}#mcpause-app label{display:block;font-size:12px;color:var(--p-muted)}
    #mcpause-app input[type="number"]{display:block;width:100%;min-height:42px;padding:8px 10px;margin-top:5px;font:inherit;font-size:16px;color:var(--p-fg);background:var(--p-bg);border:1px solid var(--p-line);border-radius:8px}
    #mcpause-app .p-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}#mcpause-app .p-choice{text-align:left;display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--p-soft);min-width:0}#mcpause-app .p-choice[aria-pressed="true"]{border-color:var(--p-fg)}#mcpause-app .p-price{font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}#mcpause-app .p-foodname{overflow-wrap:anywhere;flex:1}
    #mcpause-app .p-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}#mcpause-app .p-summary{padding:15px;border-radius:11px;background:var(--p-soft);margin:14px 0;overflow-wrap:anywhere}#mcpause-app .p-values{display:flex;gap:16px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
    #mcpause-app .p-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}#mcpause-app .p-facts span{display:block}#mcpause-app details{margin:12px 0}#mcpause-app summary{color:var(--p-muted);font-size:12px}
    #mcpause-app .p-foods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0}#mcpause-app .p-food{display:flex;align-items:flex-start;gap:9px;padding:12px;background:var(--p-soft);border-radius:10px;color:var(--p-fg);font-size:14px}#mcpause-app .p-food input{margin-top:5px;accent-color:var(--p-ink)}#mcpause-app .p-food span{display:block}
    #mcpause-app .p-code{font:13px/1.7 ui-monospace,SFMono-Regular,monospace;background:var(--p-soft);padding:14px;border-radius:10px;overflow-wrap:anywhere}#mcpause-app .p-pass{color:var(--p-ok)}#mcpause-app .p-fail{color:var(--p-warn)}
    #mcpause-app .p-order{padding:14px 0;border-bottom:1px solid var(--p-line)}#mcpause-app .p-order:last-child{border:0}#mcpause-app .p-status{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:600}#mcpause-app .p-dot{height:9px;width:9px;border-radius:50%;background:var(--p-gold);flex:none}
    #mcpause-app .p-foot{border-top:1px solid var(--p-line);padding:12px 24px;font-size:11px;color:var(--p-muted)}#mcpause-app .p-feedback{font-size:12px;min-height:20px;margin:13px 0 0;color:var(--p-muted);white-space:pre-wrap;overflow-wrap:anywhere}#mcpause-app textarea{width:100%;min-height:100px;margin-top:10px;padding:10px;font:13px/1.6 inherit;color:var(--p-fg);background:var(--p-soft);border:1px solid var(--p-line);border-radius:8px}
    #mcpause-app .p-order-area{position:relative}#mcpause-app .p-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}#mcpause-app .p-paper{position:absolute;width:7px;height:12px;background:var(--p-gold);animation:mcpause-fall 1.2s ease-out both}#mcpause-app .p-paper:nth-child(3n){background:var(--p-ok)}#mcpause-app .p-paper:nth-child(3n+1){background:var(--p-warn)}@keyframes mcpause-fall{from{transform:translateY(-10px) rotate(0);opacity:1}to{transform:translateY(230px) rotate(240deg);opacity:0}}
    @media(max-width:600px){#mcpause-app .p-options{grid-template-columns:1fr}#mcpause-app .p-choice{gap:4px}#mcpause-app .p-main{padding:18px 16px}#mcpause-app .p-head{padding:18px 16px 12px}#mcpause-app .p-mode{padding-left:16px}#mcpause-app .p-nav{padding-left:10px}#mcpause-app .p-foot{padding:12px 16px}#mcpause-app .p-controls{grid-template-columns:1fr 1fr}#mcpause-app .p-foods{grid-template-columns:1fr}#mcpause-app .p-facts{grid-template-columns:1fr 1fr}}
    @media(pointer:coarse){#mcpause-app button{min-height:44px}}@media(prefers-reduced-motion:reduce){#mcpause-app .p-paper{display:none;animation:none}}
  </style>
  <div class="p-shell">
    <header class="p-head"><div class="p-logo" aria-hidden="true">Ⅱ</div><div><h2>麦麦暂停键 <span class="p-small">McPause</span></h2><div class="p-small">暂停一下，安排一餐。</div></div></header>
    <div class="p-mode" data-mode></div>
    <nav class="p-nav" aria-label="用餐功能"><button type="button" class="cursor-interaction" data-tab="meal" aria-pressed="true">这一餐</button><button type="button" class="cursor-interaction" data-tab="game" aria-pressed="false">修复一餐</button><button type="button" class="cursor-interaction" data-tab="orders" aria-pressed="false">订单</button></nav>
    <div class="p-main">
      <section data-section="meal" aria-label="用餐方案">
        <div class="p-small" data-context></div><h3>今天，这一餐怎么选？</h3>
        <div class="p-controls"><label>预算上限（元）<input aria-label="预算上限（元）" type="number" min="1" max="1000" step="0.01" data-budget></label><label>能量上限（kcal）<input aria-label="能量上限（kcal）" type="number" min="1" max="5000" step="1" placeholder="不限制" data-kcal></label><label>蛋白质下限（g）<input aria-label="蛋白质下限（g）" type="number" min="0" max="300" step="0.1" placeholder="不限制" data-protein></label></div>
        <div class="p-options" data-options></div><div class="p-small" data-recommend-note aria-live="polite"></div>
        <div class="p-summary" data-selected hidden><div data-selected-name></div><div class="p-values" data-selected-totals></div><details><summary>查看营养明细</summary><div class="p-facts" data-facts></div></details></div>
        <div class="p-actions"><button type="button" class="p-primary cursor-interaction" data-action="quote">核对当前价格</button></div>
        <div class="p-actions"><button type="button" class="cursor-interaction" data-action="snooze">20 分钟后再说</button><button type="button" class="cursor-interaction" data-action="done">这餐已安排</button></div>
        <p class="p-small">菜单参考价仍需核价；未匹配的营养显示“未知”。目标由你决定。</p>
      </section>
      <section data-section="game" aria-label="修复一餐小游戏" hidden><div class="p-small">补给编译器 · 使用上方选定的目标</div><h3>换一样，让这一餐更合适。</h3><div class="p-code" data-game-goal></div><div class="p-foods" data-foods></div><div class="p-code" data-game-result aria-live="polite"></div><div class="p-actions"><button type="button" class="p-primary cursor-interaction" data-action="repair">找一次替换方案</button><button type="button" class="cursor-interaction" data-action="game-quote">给这份搭配核价</button></div><div class="p-summary" data-repair hidden></div><p class="p-small">只生成候选搭配。营养未知时不能判定通过，游戏结果不触发下单。</p></section>
      <section class="p-order-area" data-section="orders" aria-label="订单进度" hidden><div class="p-small">以最近一次查询结果为准</div><h3>这一餐，到哪一步了？</h3><div data-draft></div><div data-orders></div><div class="p-actions"><button type="button" class="p-primary cursor-interaction" data-action="refresh-orders">查询最新状态</button><button type="button" class="cursor-interaction" data-action="demo-next" hidden>模拟开始配送</button></div><div class="p-confetti" aria-hidden="true"></div></section>
      <div class="p-feedback" data-feedback role="status" aria-live="polite"></div><textarea data-fallback readonly aria-label="复制这段请求到 Codex 聊天" hidden></textarea>
    </div>
    <footer class="p-foot" data-footer></footer>
  </div>
  <script type="application/json" id="mcpause-data">__MCPAUSE_DATA__</script>
  <script>
  (() => {
    const root=document.getElementById('mcpause-app');
    const data=JSON.parse(root.querySelector('#mcpause-data').textContent);
    const one=s=>root.querySelector(s), all=s=>[...root.querySelectorAll(s)];
    const foods=data.catalog.foods||[], demo=data.mode==='demo';
    const labels={energyKcal:['能量','kcal'],protein:['蛋白质','g'],fat:['脂肪','g'],carbohydrate:['碳水','g'],sodium:['钠','mg'],calcium:['钙','mg']};
    let chosen=[], game=new Set(), demoStep=0, dirty=false;
    const viewKey=JSON.stringify([data.mode,data.catalog.context,foods.map(f=>f.id)]);
    const money=c=>Number.isFinite(c)?'¥'+(c/100).toFixed(2):'未知';
    const value=(v,unit)=>Number.isFinite(v)?Math.round(v*100)/100+' '+unit:'未知';
    const elem=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
    const feedback=text=>one('[data-feedback]').textContent=text;
    one('[data-mode]').textContent=demo?'离线演示 · 全部商品、价格、营养和状态为虚构示例':'实时查询所得菜单快照 · 页面不会自行刷新或下单';
    one('[data-footer]').textContent=demo?'独立开发，非官方产品 · 演示不联网、不创建提醒、不下单':'独立开发，非官方产品 · 价格和供应以官方核价为准 · 营养仅供参考';
    one('[data-context]').textContent=data.catalog.context.label||'按已选择门店的可售单品搭配';
    const constraints=data.constraints||{};
    one('[data-budget]').value=(constraints.budget_cents||3000)/100;
    one('[data-kcal]').value=constraints.max_kcal??'';
    one('[data-protein]').value=constraints.min_protein??'';
    const settings=()=>({budget:Math.round(Number(one('[data-budget]').value)*100),kcal:one('[data-kcal]').value===''?null:Number(one('[data-kcal]').value),protein:one('[data-protein]').value===''?null:Number(one('[data-protein]').value),sodium:constraints.max_sodium??null});
    const validInputs=()=>all('.p-controls input').every(input=>input.validity.valid)&&Number(one('[data-budget]').value)>0;
    function sum(items){const out={cost:0,...Object.fromEntries(Object.keys(labels).map(k=>[k,0]))};for(const f of items){out.cost=out.cost===null||!Number.isFinite(f.reference_cents)?null:out.cost+f.reference_cents;for(const key of Object.keys(labels)){const n=f.nutrition?.values?.[key];out[key]=out[key]===null||!Number.isFinite(n)?null:out[key]+n;}}return out;}
    function problems(total){if(!validInputs())return ['请填写有效预算与营养目标'];const s=settings(),found=[];for(const [key,limit,dir,title,unit]of[['cost',s.budget,'max','预算','分'],['energyKcal',s.kcal,'max','能量','kcal'],['protein',s.protein,'min','蛋白质','g'],['sodium',s.sodium,'max','钠','mg']]){if(limit===null)continue;if(!Number.isFinite(total[key]))found.push(title+'数据未知');else if(dir==='max'&&total[key]>limit)found.push(title+'超出 '+(key==='cost'?money(total[key]-limit):value(total[key]-limit,unit)));else if(dir==='min'&&total[key]<limit)found.push(title+'还差 '+value(limit-total[key],unit));}return found;}
    function select(items){chosen=items;one('[data-selected]').hidden=!items.length;one('[data-selected-name]').textContent=items.map(f=>f.name).join(' ＋ ');const total=sum(items),box=one('[data-selected-totals]');box.replaceChildren(elem('span','菜单参考 '+money(total.cost)),elem('span',value(total.energyKcal,'kcal')),elem('span','蛋白 '+value(total.protein,'g')));const facts=one('[data-facts]');facts.replaceChildren(...Object.entries(labels).map(([k,[title,unit]])=>elem('span',title+' '+value(total[k],unit))));one('[data-action="quote"]').disabled=!items.length;}
    function recommend(){const options=one('[data-options]');options.replaceChildren();select([]);if(!validInputs()){one('[data-recommend-note]').textContent='请填写有效预算与营养目标。';return;}const group=k=>foods.filter(f=>f.kind===k&&Number.isInteger(f.reference_cents)&&f.reference_cents>0).sort((a,b)=>a.reference_cents-b.reference_cents).slice(0,40);const candidates=[];for(const main of group('main'))for(const side of [null,...group('side')])for(const drink of [null,...group('drink')]){const items=[main,side,drink].filter(Boolean),total=sum(items);if(!problems(total).length)candidates.push({items,total});}const rankings=[['省钱优先',(a,b)=>a.total.cost-b.total.cost],['蛋白优先',(a,b)=>(b.total.protein??-1)-(a.total.protein??-1)||a.total.cost-b.total.cost],['丰富一些',(a,b)=>b.items.length-a.items.length||a.total.cost-b.total.cost]];const used=new Set();for(const [label,compare]of rankings){const candidate=[...candidates].sort(compare).find(c=>!used.has(c.items.map(f=>f.id).join('|')));if(!candidate)continue;used.add(candidate.items.map(f=>f.id).join('|'));const button=elem('button',undefined,'p-choice cursor-interaction');button.type='button';button.setAttribute('aria-pressed',String(used.size===1));button.append(elem('span',label,'p-small'),elem('span',money(candidate.total.cost),'p-price'),elem('span',candidate.items.map(f=>f.name).join(' ＋ '),'p-foodname'),elem('span',value(candidate.total.energyKcal,'kcal')+' · 蛋白 '+value(candidate.total.protein,'g'),'p-small'));button.addEventListener('click',()=>{dirty=true;all('.p-choice').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));select(candidate.items);drawDraft();});options.append(button);if(used.size===1)select(candidate.items);}one('[data-recommend-note]').textContent=candidates.length?'仅在数据充分、满足目标的单品组合中筛选。':'未找到符合全部条件的组合；可调整目标，或让 Codex 查询套餐详情。';}
    function gameFoods(){const list=one('[data-foods]');list.replaceChildren();for(const f of foods.filter(f=>['main','side','drink'].includes(f.kind)).slice(0,80)){const label=elem('label',undefined,'p-food'),input=document.createElement('input');input.type='checkbox';input.checked=game.has(f.id);input.setAttribute('aria-label',f.name);input.addEventListener('change',()=>{input.checked?game.add(f.id):game.delete(f.id);one('[data-repair]').hidden=true;drawGame();});const text=elem('span',f.name);text.append(elem('span',money(f.reference_cents)+' · '+value(f.nutrition?.values?.energyKcal,'kcal')+' · 蛋白 '+value(f.nutrition?.values?.protein,'g'),'p-small'));label.append(input,text);list.append(label);}}
    function drawGame(){const s=settings(),items=foods.filter(f=>game.has(f.id)),total=sum(items),errors=problems(total);one('[data-game-goal]').textContent='预算 ≤ '+money(s.budget)+(s.kcal!==null?' · 能量 ≤ '+s.kcal+' kcal':'')+(s.protein!==null?' · 蛋白 ≥ '+s.protein+' g':'')+(s.sodium!==null?' · 钠 ≤ '+s.sodium+' mg':'');const result=one('[data-game-result]');result.replaceChildren(elem('div',money(total.cost)+' / '+value(total.energyKcal,'kcal')+' / 蛋白 '+value(total.protein,'g')),elem('div',!items.length?'先选几样餐品':errors.length?errors.join('；'):'编译通过 ✓ 可以进一步核价',!items.length||errors.length?'p-fail':'p-pass'));one('[data-action="game-quote"]').disabled=!items.length||errors.length>0;}
    function repair(){const items=foods.filter(f=>game.has(f.id)),box=one('[data-repair]');box.hidden=false;box.replaceChildren();if(!items.length){box.textContent='先选择一份要调整的搭配。';return;}const before=sum(items),swaps=[];for(let i=0;i<items.length;i++)for(const f of foods){if(game.has(f.id)||f.kind!==items[i].kind)continue;const next=[...items];next[i]=f;const total=sum(next);if(!problems(total).length)swaps.push({from:items[i],to:f,total});}swaps.sort((a,b)=>a.total.cost-b.total.cost);const pick=swaps[0];if(!pick){box.textContent='一次同类替换还无法满足全部目标。试着调整目标，或增减餐品。';return;}box.append(elem('div','把「'+pick.from.name+'」换成「'+pick.to.name+'」'),elem('div','餐费 '+money(before.cost)+' → '+money(pick.total.cost)+'；蛋白 '+value(before.protein,'g')+' → '+value(pick.total.protein,'g'),'p-small'));const button=elem('button','采用这次替换','cursor-interaction');button.type='button';button.addEventListener('click',()=>{game.delete(pick.from.id);game.add(pick.to.id);gameFoods();drawGame();box.hidden=true;});box.append(button);}
    function drawDraft(){const box=one('[data-draft]');box.replaceChildren();const d=data.draft;if(!d)return;box.append(elem('div','待确认单 '+d.id+' · '+money(d.total_cents),'p-small'),elem('p',d.summary));const expired=Date.now()>Date.parse(d.expires_at);const button=elem('button',expired||dirty?'重新核价后再确认':'确认创建这份订单','p-primary cursor-interaction');button.type='button';button.disabled=expired||dirty;button.addEventListener('click',()=>send('我确认创建已展示的 McPause 确认单 '+d.id+'，金额 '+money(d.total_cents)+'。请复核该确认单的有效期、内容和最新价格；价格或内容变化时重新询问。'));box.append(button);}
    function drawOrders(){const target=one('[data-orders]');target.replaceChildren();const orders=demo?[{reference:'DEMO-001',label:['待支付','配送中','已送达'][demoStep],payment_label:demoStep?'已支付':'待支付',eta:'',updated_at:null}]:data.orders;for(const o of orders){const row=elem('div',undefined,'p-order'),status=elem('div',undefined,'p-status');status.append(elem('span',undefined,'p-dot'),elem('span',o.label||'状态未知'));row.append(elem('div',o.reference||'已记录订单','p-small'),status,elem('div','支付：'+(o.payment_label||'未知'),'p-small'));if(o.take_code)row.append(elem('p','取餐码：'+o.take_code));row.append(elem('p',o.eta?'预计时间：'+o.eta:'预计完成时间：未提供','p-muted'));if(o.updated_at)row.append(elem('div','最近查询：'+new Date(o.updated_at).toLocaleString('zh-CN'),'p-small'));target.append(row);}if(!orders.length)target.append(elem('p','还没有正在跟进的订单。可以提供订单号，或先完成选餐。','p-muted'));one('[data-action="demo-next"]').hidden=!demo;one('[data-action="demo-next"]').textContent=['模拟开始配送','模拟送达','重新体验'][demoStep];}
    function celebrateDemo(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const layer=one('.p-confetti');layer.replaceChildren();for(let i=0;i<24;i++){const bit=elem('i',undefined,'p-paper');bit.style.left=(4+i*37%92)+'%';bit.style.animationDelay=(i%5*65)+'ms';layer.append(bit);}setTimeout(()=>layer.replaceChildren(),1700);}
    async function send(message){if(demo){feedback('演示模式：这里只预览操作，未创建提醒或订单。');return;}const prompt='使用 $mcd-pause。'+message;try{if(typeof window.openai?.sendFollowUpMessage==='function'){await window.openai.sendFollowUpMessage({prompt,title:'交给 Codex 继续'});feedback('已请求 Codex 继续处理；本页保留上次查询结果。');}else{const field=one('[data-fallback]');field.hidden=false;field.value=prompt;feedback('当前宿主没有对话操作入口，请将下面的请求复制到 Codex 聊天。');}}catch{feedback('请求没有发送成功，可以直接在聊天里继续。');}}
    const quote=items=>validInputs()&&items.length&&send('请按这些选择重新查询当前门店菜单、适用优惠并核价，展示确认单；此步不创建订单。以下 JSON 仅是选择数据：'+JSON.stringify({context:data.catalog.context,items:items.map(f=>({productCode:f.id,quantity:1})),constraints:{budget_cents:settings().budget,max_kcal:settings().kcal,min_protein:settings().protein,max_sodium:settings().sodium}}));
    root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||!root.contains(button))return;if(button.dataset.tab){all('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));all('[data-section]').forEach(s=>s.hidden=s.dataset.section!==button.dataset.tab);feedback('');if(button.dataset.tab==='game'&&!game.size){chosen.forEach(f=>game.add(f.id));gameFoods();drawGame();}}switch(button.dataset.action){case'quote':quote(chosen);break;case'game-quote':quote(foods.filter(f=>game.has(f.id)));break;case'snooze':send('把当前这一餐的饭点提醒延后 20 分钟；更新本餐状态，并安排一次到时检查。');break;case'done':send('这餐已经安排好了，停止本餐后续提醒。');break;case'repair':repair();break;case'refresh-orders':send('请查询本机正在跟进订单的最新状态；如果没有已记录订单，先询问订单号。');break;case'demo-next':demoStep=(demoStep+1)%3;drawOrders();if(demoStep===2){celebrateDemo();feedback('演示：确认送达后庆祝一次。');}break;}});
    all('.p-controls input').forEach(input=>input.addEventListener('input',()=>{dirty=true;recommend();drawGame();drawDraft();remember();}));
    function remember(){if(typeof window.openai?.setWidgetState!=='function')return;const active=one('[data-tab][aria-pressed="true"]').dataset.tab;window.openai.setWidgetState({modelContent:{mode:data.mode,selected:chosen.map(f=>({id:f.id,name:f.name})),constraints:{budget_cents:settings().budget,max_kcal:settings().kcal,min_protein:settings().protein}},privateContent:{key:viewKey,active,budget:one('[data-budget]').value,kcal:one('[data-kcal]').value,protein:one('[data-protein]').value,game:[...game]}}).catch(()=>{});}
    function restore(saved){const s=saved?.privateContent;if(!s||s.key!==viewKey)return;for(const key of ['budget','kcal','protein'])if(typeof s[key]==='string')one('[data-'+key+']').value=s[key];game=new Set(Array.isArray(s.game)?s.game.filter(id=>foods.some(f=>f.id===id)):[]);const active=['meal','game','orders'].includes(s.active)?s.active:'meal';all('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===active)));all('[data-section]').forEach(p=>p.hidden=p.dataset.section!==active);dirty=true;recommend();gameFoods();drawGame();drawDraft();}
    root.addEventListener('click',event=>{if(event.target.closest('button'))remember();});
    root.addEventListener('change',event=>{if(event.target.matches('input[type="checkbox"]'))remember();});
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
    recommend();gameFoods();drawGame();drawDraft();drawOrders();restore(window.openai?.widgetState);
  })();
  </script>
</div>
