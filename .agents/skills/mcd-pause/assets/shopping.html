    @media(max-width:420px){#mcpause-shop{border-radius:0}#mcpause-shop .mp-header{padding:20px 16px 16px}#mcpause-shop .mp-brand{font-size:20px}#mcpause-shop .mp-menu-layout{display:block}#mcpause-shop .mp-categories{flex-direction:row;padding:8px 16px;gap:8px}#mcpause-shop .mp-category{min-height:44px;padding:8px 16px}#mcpause-shop .mp-category[aria-pressed=true]{background:var(--mp-yellow);color:var(--mp-on-yellow)}#mcpause-shop .mp-category[aria-pressed=true]:before{display:none}#mcpause-shop .mp-menu-content{padding:18px 16px}#mcpause-shop .mp-meal{gap:10px}#mcpause-shop .mp-meal-photo{flex-basis:96px}#mcpause-shop .mp-meal-photo img{width:96px;height:108px}#mcpause-shop .mp-meal-description{display:none}#mcpause-shop .mp-pick{padding:6px 10px}#mcpause-shop .mp-editor{padding:10px 16px 20px}#mcpause-shop .mp-title{font-size:22px}#mcpause-shop .mp-choices{grid-template-columns:repeat(2,minmax(0,1fr))}#mcpause-shop .mp-choice img{height:72px}#mcpause-shop .mp-checkout{padding:16px}#mcpause-shop .mp-checkout-main{align-items:stretch;flex-direction:column}#mcpause-shop .mp-checkout-main .mp-button{width:100%}#mcpause-shop .mp-fallback textarea{font-size:16px}}
    #mcpause-shop [hidden]{display:none!important}
  </style>
  <header class="mp-header">

      <h3 class="mp-section-heading" data-list-title>这一餐，先看新品</h3>

    <div class="mp-intro">
      <figure class="mp-hero" data-hero hidden></figure>

        <span class="mp-badge" data-detail-badge hidden>新品</span>

        <div><span class="mp-price" data-food-price></span><span class="mp-caption"> 餐品预估价</span></div>

    </div>

    <div data-product-mods></div>

    <button type="button" class="mp-button mp-button-primary" data-copy>复制核价请求</button>

  <script type="application/json" id="mcpause-shop-data">__MCPAUSE_SHOP_DATA__</script>
  <script>
  (() => {
    const root = document.getElementById('mcpause-shop');
    const data = JSON.parse(root.querySelector('#mcpause-shop-data').textContent);
    const one = selector => root.querySelector(selector);
    const money = value => Number.isFinite(value) ? '¥' + (value / 100).toFixed(2) : '待核价';
    const node = (tag, text, cls) => { const el = document.createElement(tag); if(text !== undefined) el.textContent=text; if(cls) el.className=cls; return el; };
    const key = JSON.stringify([data.context.storeCode,data.context.beCode,data.context.orderType,data.context.reservationDate,data.cards.map(c=>c.code)]);
    const states = {}, expandedRounds = new Set();
    let selected = data.selected, view = 'recommendations', category = 'all', sending = false, modGroup = 0;
    let repeatSaving = data.card_comparison?.repeat_saving_assumption_cents ?? 0;
    let detailTimer=null, detailKey='', detailVersion=0, detailStatus='', detailFailed=false;
    const stable = value => JSON.stringify(value, (_, v) => v && typeof v==='object' && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map(k=>[k,v[k]])) : v);
    function photo(parent,url,name) {
      if(!data.images_enabled||!url)return false;
      const img=node('img');img.src=url;img.alt=name;img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';
      img.addEventListener('error',()=>{img.hidden=true;img.dataset.failed='true';parent.append(node('span','餐品图暂不可用','mp-photo-unavailable'));},{once:true});
      parent.append(img);return true;
    }
    const card = () => data.cards.find(c=>c.code===selected);
    const defaultMods = groups => groups.map(g=>g.values.map(v=>Number.isInteger(v.selectedQuantity)?v.selectedQuantity:0));
    const firstChoice = r => r.choices.find(c=>c.default) || r.choices[0];
    const stateFor = c => {
      if(!states[c.code]) states[c.code]={rounds:Object.fromEntries((c.detail?.rounds||[]).map(r=>[r.id,firstChoice(r)?.code])),mods:{},productMods:defaultMods(c.detail?.modifications||[])};
      return states[c.code];
    };
    const choiceFor = (c,r) => r.choices.find(x=>x.code===stateFor(c).rounds[r.id]);
    const single = r => r.min===1&&r.max===1;
    function choicesFor(c,r){
      if(single(r)){const ch=choiceFor(c,r);return ch?[{ch,quantity:1}]:[];}
      const s=stateFor(c);s.counts||={};s.counts[r.id]||=Object.fromEntries(r.choices.map(ch=>[ch.code,ch.quantity||0]));
      return r.choices.filter(ch=>s.counts[r.id][ch.code]>0).map(ch=>({ch,quantity:s.counts[r.id][ch.code]}));
    }
    const modSlot = (c,r,ch) => r.id + ':' + ch.code;
    const modsFor = (c,r,ch) => { const s=stateFor(c), slot=modSlot(c,r,ch); return s.mods[slot] ||= defaultMods(ch.modifications); };
    const maxValue = v => Number.isInteger(v.maxQuantity)&&v.maxQuantity>=0?v.maxQuantity:20;
    const isIce = g => g.values.some(v=>['去冰','少冰','多冰'].includes(v.name));
    function validateMods(groups,values) {
      for(let gi=0;gi<groups.length;gi++) {
        const group=groups[gi], amounts=values[gi]||[], chosen=amounts.filter(q=>q>0).length;
        if(chosen<group.min||chosen>group.max) return '请按配料要求完成选择。';
        for(let vi=0;vi<group.values.length;vi++) {
          const v=group.values[vi], q=amounts[vi];
          if(!Number.isInteger(q)||q<0||q>maxValue(v)||(q>0&&q<(v.minQuantity||0))||(q>0&&!v.selectedKey)) return '配料数量或选项无效，请重新选择。';
        }
      }
      return '';
    }
    function validation(c) {
      if(!c?.detail) return '需要先读取这份餐品的可选搭配。';
      for(const r of c.detail.rounds) {
        const choices=choicesFor(c,r),total=choices.reduce((n,x)=>n+x.quantity,0);
        if(total<r.min||total>r.max) return r.name+'需要选择 '+r.min+'–'+r.max+' 份。';
        for(const {ch,quantity} of choices){
          if(!Number.isInteger(quantity)||quantity<1||(ch.max>=0&&quantity>ch.max))return '餐品数量不符合要求。';
          const error=validateMods(ch.modifications,modsFor(c,r,ch));if(error)return error;
        }
      }
      return validateMods(c.detail.modifications,stateFor(c).productMods);
    }
    function modPayload(groups,values) {
      const result=[];
      groups.forEach((g,gi)=>g.values.forEach((v,vi)=>{
        const quantity=values[gi][vi], selectedKey=quantity>0?v.selectedKey:v.unselectedKey;
        if(selectedKey) result.push({code:v.code,key:selectedKey,quantity});
      }));
      return result.length?{values:result}:null;
    }
    function itemFor(c) {
      const item={productCode:c.code,quantity:1};
      if(c.detail.rounds.length) item.roundList=c.detail.rounds.map(r=>{
        return {round:r.id,comboItemList:choicesFor(c,r).map(({ch,quantity})=>{const entry={code:ch.code,quantity},modification=modPayload(ch.modifications,modsFor(c,r,ch));if(modification)entry.modification=modification;return entry;})};
      });
      const modification=modPayload(c.detail.modifications,stateFor(c).productMods);
      if(modification) item.modification=modification;
      return item;
    }
    function modDelta(groups,values) {
      let amount=0;

          if(single(r)&&selection.length===1&&selection[0].quantity===1)s.rounds[r.id]=selection[0].code;
          if(!single(r)){s.counts||={};s.counts[r.id]=Object.fromEntries(r.choices.map(ch=>[ch.code,0]));}
          for(const entry of selection){const ch=r.choices.find(x=>x.code===entry.code);if(!ch)continue;if(!single(r))s.counts[r.id][ch.code]=entry.quantity;const quantities=restoreMods(ch.modifications,entry.modification);if(!validateMods(ch.modifications,quantities))s.mods[modSlot(c,r,ch)]=quantities;}
        }
        const quantities=restoreMods(c.detail.modifications,item.modification);
        if(!validateMods(c.detail.modifications,quantities))s.productMods=quantities;
      }
      if(data.cards.some(c=>c.code===saved.selected))selected=saved.selected;
      view=saved.view==='detail'&&card()?'detail':'recommendations';
      category=['all','new',...(data.categories||[]).map(g=>g.id)].includes(saved.category)?saved.category:'all';
      if(category==='new'&&card()&&!card().new)category='all';
      if(saved.cardComparisonAt===data.card_comparison?.quoted_at&&Number.isSafeInteger(saved.repeatSaving)&&saved.repeatSaving>=0)repeatSaving=saved.repeatSaving;
      drawCards();drawEditor();drawPage();
    }
    one('[data-context]').textContent=data.context.label||'当前门店 · 实际可售菜单';
    one('[data-delivery]').textContent=data.context.delivery_label||'';
    if(data.standalone){root.dataset.standalone='';one('[data-quote]').textContent='带回聊天核价';one('[data-cart-add]').hidden=!data.browser_session;}
    if(data.browser_session){one('[data-quote]').hidden=true;one('[data-card-section]').hidden=true;one('[data-cart-add]').className='mp-button mp-button-primary';}
    one('[data-back]').addEventListener('click',()=>{view='recommendations';drawCards();drawPage(true);remember();});
    one('[data-quote]').addEventListener('click',()=>{
      const c=card();if(validation(c))return;
      if(data.browser_session){scheduleDetailComparison(true);return;}
      remember();
      send('我选好这份搭配了。请核对当前门店实时详情及以下完整选择，沿用本聊天已保存的配送方式和地址，重新核价并展示新的确认单，包含配送、打包与优惠。此步不创建订单，也不沿用旧确认单。选择数据：'+JSON.stringify({context:data.context,items:[itemFor(c)],summary:description(c)}), 'quote', {items:[itemFor(c)]});
    });
    one('[data-compare-card]').addEventListener('click',()=>{
      const c=card();if(validation(c))return;
      if(data.browser_session){scheduleDetailComparison(true);return;}
      remember();
      send('请比较这份餐单不开卡与随单开卡的优惠。按 membership.md 流程查询当前 query-meals 的 withOrder 选项，对同一餐单分别 calculate-price；列出开卡费、配送/打包等减免、本次实付、扣卡费后的净省和有条件的回本次数，并把核价证据更新到当前两页界面。缺失权益或费用显示待核实，不用划线价算回本，不改变当前搭配，不开卡、不创建订单。选择数据：'+JSON.stringify({context:data.context,items:[itemFor(c)],summary:description(c)}), 'compare', {items:[itemFor(c)]});
    });
    one('[data-repeat-saving]').addEventListener('input',event=>{
      const value=event.target.value;
      if(/^\d+(?:\.\d{1,2})?$/.test(value)) {
        const [whole,fraction='']=value.split('.'), amount=Number(whole)*100+Number(fraction.padEnd(2,'0'));
        repeatSaving=Number.isSafeInteger(amount)?amount:null;
      } else repeatSaving=null;
      updatePayback();remember();
    });
    one('[data-copy]').addEventListener('click',async()=>{
      try{await navigator.clipboard.writeText(one('[data-fallback]').value);one('[data-feedback]').textContent='已复制，粘贴到当前聊天即可继续。';}
      catch{one('[data-fallback]').focus();one('[data-fallback]').select();one('[data-feedback]').textContent='请复制已选中的请求，粘贴到当前聊天。';}
    });
    window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)restore(event.detail.globals.widgetState);});
    one('[data-cart-add]').addEventListener('click',()=>{const c=card();if(!validation(c))window.mcpauseAddToCart?.({item:itemFor(c),name:c.name,summary:description(c)});});
    if(data.standalone)window.mcpauseShopping={context:data.context,selected:()=>selected,description:()=>description(card()),cartChanged:updateSummary,start:()=>{if(view==='detail'&&card()&&!card().detail)send('', 'detail', {code:selected});else scheduleDetailComparison();}};
    if(card()?.detail)stateFor(card());drawCards();drawEditor();drawPage();restoreComparedSelection();restore(window.openai?.widgetState);
    if(data.standalone&&!window.openai?.widgetState)try{restore(JSON.parse(sessionStorage.getItem('mcpause-shopping')));}catch{}
  })();
  </script>
</div>
